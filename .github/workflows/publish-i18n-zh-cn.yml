# Agent Skills 中文版 - 自动发布工作流
# 当 feature/i18n-zh-cn 分支有新推送时，自动构建文档站点并发布到 GitHub Pages

name: 发布中文版文档

on:
  push:
    branches: [feature/i18n-zh-cn]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: feature/i18n-zh-cn

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: 安装依赖
        working-directory: docs
        run: npm ci

      - name: 构建文档站点
        working-directory: docs
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
